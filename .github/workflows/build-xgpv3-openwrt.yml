name: Build OpenWrt for xgpv3

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  Build_Device: xgpv3

  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
        docker image prune -af || true
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt clean

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
             bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
             g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
             libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
             libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
             ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
             python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
             upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache OpenWrt build
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
          ${{ github.workspace }}/openwrt/staging_dir
          ${{ github.workspace }}/openwrt/build_dir
          ${{ github.workspace }}/openwrt/dl
        key: ${{ runner.os }}-openwrt-${{ hashFiles('**/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-

    - name: Load custom feeds
      run: |
        [ -e $Build_Device/feeds.conf.default ] && mv $Build_Device/feeds.conf.default openwrt/feeds.conf.default
        chmod +x $Build_Device/before_feeds.sh
        cd openwrt
        $GITHUB_WORKSPACE/$Build_Device/before_feeds.sh

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        mv $Build_Device/files openwrt/files
        mv $Build_Device/firstboot_custom.sh openwrt/package/base-files/files/etc/uci-defaults/999-firstboot_custom.sh
        mv $Build_Device/make.config openwrt/.config
        chmod +x $Build_Device/after_feeds.sh
        cd openwrt
        $GITHUB_WORKSPACE/$Build_Device/after_feeds.sh

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc) || make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize sysupgrade images
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        find . -type f -name '*-squashfs-sysupgrade.img.gz' -print > ../sysupgrade_list.txt
        if [ -s ../sysupgrade_list.txt ]; then
          mkdir -p ../../sysupgrade
          while read -r f; do
            cp "$f" ../../sysupgrade/
          done < ../sysupgrade_list.txt
          echo "FIRMWARE=$(realpath ../../sysupgrade)" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
        else
          echo "❌ 未找到 sysupgrade 镜像文件"
          exit 1
        fi

    - name: Upload sysupgrade images
      uses: actions/upload-artifact@v4
      if: success() && steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_sysupgrade${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}/*.img.gz
        retention-days: 30
